name: XAUUSD Forensic Backtest Workflow

on:
  workflow_dispatch: # Mengaktifkan tombol "Run workflow" di HP
  schedule:
    - cron: '0 0 * * 1' # Berjalan otomatis setiap hari Senin jam 00:00 UTC

jobs:
  run-forensic-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml python-dotenv requests urllib3

      - name: Run Backtest Script
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python backtest.py
