name: XAUUSD Apex Ultima Forensic Quant Bot

on:
  schedule:
    - cron: '0 * * * *'  # Berjalan otomatis setiap 1 jam sekali
  workflow_dispatch:      # Memungkinkan eksekusi manual via tab Actions GitHub

jobs:
  run-forensic-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quantitative Trading Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
